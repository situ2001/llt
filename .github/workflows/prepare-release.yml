name: Prepare release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version (without v prefix)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: rustup show
      - name: Set version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release.mjs set-version "$RELEASE_VERSION"
      - run: node scripts/release.mjs install-bindgen
      - run: node scripts/release.mjs build
      - name: Create or update release PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch="release/v$RELEASE_VERSION"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock packages/llt-wasm/package.json \
            packages/llt-wasm/llt.js packages/llt-wasm/llt.d.ts \
            packages/llt-wasm/llt_bg.wasm packages/llt-wasm/llt_bg.wasm.d.ts
          if git diff --cached --quiet; then
            echo "No release changes for v$RELEASE_VERSION."
            exit 0
          fi
          git commit -m "chore: prepare release v$RELEASE_VERSION"
          expected="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          git push --force-with-lease="refs/heads/$branch:$expected" \
            origin "HEAD:refs/heads/$branch"
          pr="$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state open \
            --json number --jq '.[0].number // empty')"
          if [[ -n "$pr" ]]; then
            echo "Updated release PR #$pr."
          else
            gh pr create --head "$branch" --base "$BASE_BRANCH" \
              --title "Release v$RELEASE_VERSION" \
              --body 'Synchronizes the Rust and npm versions, updates Cargo.lock, and rebuilds the WebAssembly dist. Merge after reviewing the changes and passing CI. Publishing is manual.'
          fi
