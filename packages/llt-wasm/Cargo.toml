[package]
name = "llt-wasm"
license = "MIT"
version.workspace = true
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
llt = { path = "../../crates/llt", features = ["serde"] }
serde = "1"
serde-wasm-bindgen = "0.6"
# scripts/release.mjs installs the matching CLI version.
wasm-bindgen = "=0.2.130"

[lints]
workspace = true
